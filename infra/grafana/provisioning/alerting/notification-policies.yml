apiVersion: 1

policies:
  - orgId: 1
    receiver: Email FinovaTech
    group_by:
      - alertname
      - job
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: Email FinovaTech
        matchers:
          - severidade = critica
        group_wait: 10s
        repeat_interval: 1h
