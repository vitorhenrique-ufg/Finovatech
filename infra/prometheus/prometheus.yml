global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway-pagamento'
    static_configs:
      - targets: ['finovatech-gateway-pagamento:8080']
    metrics_path: '/metrics'

  - job_name: 'processador-pagamento'
    static_configs:
      - targets: ['finovatech-processador-pagamento:8080']
    metrics_path: '/metrics'

  - job_name: 'deteccao-fraude'
    static_configs:
      - targets: ['finovatech-deteccao-fraude:8080']
    metrics_path: '/metrics'

  - job_name: 'servico-notificacao'
    static_configs:
      - targets: ['finovatech-servico-notificacao:8080']
    metrics_path: '/metrics'

  - job_name: 'servico-catalogo'
    static_configs:
      - targets: ['finovatech-servico-catalogo:8080']
    metrics_path: '/metrics'

  - job_name: 'gateway-api'
    static_configs:
      - targets: ['finovatech-gateway-api:8080']
    metrics_path: '/metrics'

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['finovatech-rabbitmq:15692']
    metrics_path: '/metrics'
