<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- RAM stick 1 -->
  <rect x="100" y="80" width="170" height="260" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- RAM stick 2 -->
  <rect x="330" y="80" width="170" height="260" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Heatspreader top - stick 1 -->
  <rect x="100" y="80" width="170" height="40" rx="4" fill="#0ea5e9" opacity="0.8"/>
  <text x="185" y="106" text-anchor="middle" fill="white" font-family="monospace" font-size="9" font-weight="bold">DDR5</text>
  <!-- Heatspreader top - stick 2 -->
  <rect x="330" y="80" width="170" height="40" rx="4" fill="#0ea5e9" opacity="0.8"/>
  <text x="415" y="106" text-anchor="middle" fill="white" font-family="monospace" font-size="9" font-weight="bold">DDR5</text>
  <!-- DRAM chips - stick 1 -->
  <g fill="#111827" stroke="#475569" stroke-width="1">
    <rect x="115" y="135" width="40" height="28" rx="2"/>
    <rect x="165" y="135" width="40" height="28" rx="2"/>
    <rect x="215" y="135" width="40" height="28" rx="2"/>
    <rect x="115" y="175" width="40" height="28" rx="2"/>
    <rect x="165" y="175" width="40" height="28" rx="2"/>
    <rect x="215" y="175" width="40" height="28" rx="2"/>
    <rect x="115" y="215" width="40" height="28" rx="2"/>
    <rect x="165" y="215" width="40" height="28" rx="2"/>
    <rect x="215" y="215" width="40" height="28" rx="2"/>
  </g>
  <!-- DRAM chips - stick 2 -->
  <g fill="#111827" stroke="#475569" stroke-width="1">
    <rect x="345" y="135" width="40" height="28" rx="2"/>
    <rect x="395" y="135" width="40" height="28" rx="2"/>
    <rect x="445" y="135" width="40" height="28" rx="2"/>
    <rect x="345" y="175" width="40" height="28" rx="2"/>
    <rect x="395" y="175" width="40" height="28" rx="2"/>
    <rect x="445" y="175" width="40" height="28" rx="2"/>
    <rect x="345" y="215" width="40" height="28" rx="2"/>
    <rect x="395" y="215" width="40" height="28" rx="2"/>
    <rect x="445" y="215" width="40" height="28" rx="2"/>
  </g>
  <!-- Gold contacts - stick 1 -->
  <g fill="#f59e0b">
    <rect x="110" y="320" width="6" height="15" rx="1"/>
    <rect x="120" y="320" width="6" height="15" rx="1"/>
    <rect x="130" y="320" width="6" height="15" rx="1"/>
    <rect x="140" y="320" width="6" height="15" rx="1"/>
    <rect x="150" y="320" width="6" height="15" rx="1"/>
    <rect x="160" y="320" width="6" height="15" rx="1"/>
    <rect x="170" y="320" width="6" height="15" rx="1"/>
    <rect x="180" y="320" width="6" height="15" rx="1"/>
    <rect x="190" y="320" width="6" height="15" rx="1"/>
    <rect x="200" y="320" width="6" height="15" rx="1"/>
    <rect x="210" y="320" width="6" height="15" rx="1"/>
    <rect x="220" y="320" width="6" height="15" rx="1"/>
    <rect x="230" y="320" width="6" height="15" rx="1"/>
    <rect x="240" y="320" width="6" height="15" rx="1"/>
    <rect x="250" y="320" width="6" height="15" rx="1"/>
  </g>
  <!-- Gold contacts - stick 2 -->
  <g fill="#f59e0b">
    <rect x="340" y="320" width="6" height="15" rx="1"/>
    <rect x="350" y="320" width="6" height="15" rx="1"/>
    <rect x="360" y="320" width="6" height="15" rx="1"/>
    <rect x="370" y="320" width="6" height="15" rx="1"/>
    <rect x="380" y="320" width="6" height="15" rx="1"/>
    <rect x="390" y="320" width="6" height="15" rx="1"/>
    <rect x="400" y="320" width="6" height="15" rx="1"/>
    <rect x="410" y="320" width="6" height="15" rx="1"/>
    <rect x="420" y="320" width="6" height="15" rx="1"/>
    <rect x="430" y="320" width="6" height="15" rx="1"/>
    <rect x="440" y="320" width="6" height="15" rx="1"/>
    <rect x="450" y="320" width="6" height="15" rx="1"/>
    <rect x="460" y="320" width="6" height="15" rx="1"/>
    <rect x="470" y="320" width="6" height="15" rx="1"/>
    <rect x="480" y="320" width="6" height="15" rx="1"/>
  </g>
  <!-- Capacity labels -->
  <text x="185" y="298" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">32GB</text>
  <text x="415" y="298" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">32GB</text>
</svg>
