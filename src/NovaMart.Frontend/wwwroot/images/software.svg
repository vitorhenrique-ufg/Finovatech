<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Screen/monitor frame -->
  <rect x="80" y="60" width="440" height="280" rx="8" fill="#111827" stroke="#334155" stroke-width="2"/>
  <!-- Screen -->
  <rect x="90" y="70" width="420" height="260" rx="4" fill="#0d111a"/>
  <!-- Title bar -->
  <rect x="90" y="70" width="420" height="28" rx="4" fill="#1e293b"/>
  <!-- Traffic lights -->
  <circle cx="110" cy="84" r="6" fill="#ef4444"/>
  <circle cx="130" cy="84" r="6" fill="#f59e0b"/>
  <circle cx="150" cy="84" r="6" fill="#22c55e"/>
  <!-- Tab title -->
  <text x="300" y="89" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Visual Studio Code</text>
  <!-- Code lines -->
  <text x="110" y="120" fill="#6366f1" font-family="monospace" font-size="11">import</text>
  <text x="160" y="120" fill="#e2e8f0" font-family="monospace" font-size="11">&#123; useState &#125;</text>
  <text x="280" y="120" fill="#6366f1" font-family="monospace" font-size="11">from</text>
  <text x="316" y="120" fill="#22c55e" font-family="monospace" font-size="11">'react'</text>
  <text x="110" y="142" fill="#6366f1" font-family="monospace" font-size="11">const</text>
  <text x="155" y="142" fill="#22d3ee" font-family="monospace" font-size="11">App</text>
  <text x="185" y="142" fill="#e2e8f0" font-family="monospace" font-size="11">=</text>
  <text x="200" y="142" fill="#e2e8f0" font-family="monospace" font-size="11">() =&gt;</text>
  <text x="243" y="142" fill="#e2e8f0" font-family="monospace" font-size="11">&#123;</text>
  <text x="125" y="164" fill="#6366f1" font-family="monospace" font-size="11">const</text>
  <text x="170" y="164" fill="#e2e8f0" font-family="monospace" font-size="11">[count, setCount] =</text>
  <text x="110" y="186" fill="#f472b6" font-family="monospace" font-size="11">  useState</text>
  <text x="180" y="186" fill="#e2e8f0" font-family="monospace" font-size="11">(0)</text>
  <text x="110" y="208" fill="#6366f1" font-family="monospace" font-size="11">return</text>
  <text x="165" y="208" fill="#e2e8f0" font-family="monospace" font-size="11">(</text>
  <text x="125" y="230" fill="#22c55e" font-family="monospace" font-size="11">&lt;div</text>
  <text x="165" y="230" fill="#22d3ee" font-family="monospace" font-size="11">className</text>
  <text x="255" y="230" fill="#e2e8f0" font-family="monospace" font-size="11">=</text>
  <text x="267" y="230" fill="#f59e0b" font-family="monospace" font-size="11">"app"</text>
  <text x="307" y="230" fill="#22c55e" font-family="monospace" font-size="11">&gt;</text>
  <!-- Cursor blink -->
  <rect x="110" y="252" width="2" height="14" fill="#22d3ee" opacity="0.9"/>
  <!-- Line numbers -->
  <g fill="#334155" font-family="monospace" font-size="10">
    <text x="95" y="120">1</text>
    <text x="95" y="142">2</text>
    <text x="95" y="164">3</text>
    <text x="95" y="186">4</text>
    <text x="95" y="208">5</text>
    <text x="95" y="230">6</text>
    <text x="95" y="252">7</text>
  </g>
  <!-- Status bar -->
  <rect x="90" y="300" width="420" height="20" rx="2" fill="#1e3a5f"/>
  <text x="110" y="314" fill="#94a3b8" font-family="monospace" font-size="9">main  TypeScript  UTF-8  Ln 7, Col 1</text>
</svg>
