<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Keyboard body -->
  <rect x="40" y="120" width="520" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Key rows -->
  <!-- Row 1 (function keys) -->
  <g fill="#111827" stroke="#475569" stroke-width="1">
    <rect x="60" y="135" width="30" height="24" rx="3"/>
    <rect x="98" y="135" width="30" height="24" rx="3"/>
    <rect x="136" y="135" width="30" height="24" rx="3"/>
    <rect x="174" y="135" width="30" height="24" rx="3"/>
    <rect x="222" y="135" width="30" height="24" rx="3"/>
    <rect x="260" y="135" width="30" height="24" rx="3"/>
    <rect x="298" y="135" width="30" height="24" rx="3"/>
    <rect x="346" y="135" width="30" height="24" rx="3"/>
    <rect x="384" y="135" width="30" height="24" rx="3"/>
    <rect x="422" y="135" width="30" height="24" rx="3"/>
    <rect x="460" y="135" width="30" height="24" rx="3"/>
    <rect x="498" y="135" width="42" height="24" rx="3"/>
  </g>
  <!-- Row 2 -->
  <g fill="#111827" stroke="#475569" stroke-width="1">
    <rect x="60" y="167" width="30" height="26" rx="3"/>
    <rect x="98" y="167" width="30" height="26" rx="3"/>
    <rect x="136" y="167" width="30" height="26" rx="3"/>
    <rect x="174" y="167" width="30" height="26" rx="3"/>
    <rect x="212" y="167" width="30" height="26" rx="3"/>
    <rect x="250" y="167" width="30" height="26" rx="3"/>
    <rect x="288" y="167" width="30" height="26" rx="3"/>
    <rect x="326" y="167" width="30" height="26" rx="3"/>
    <rect x="364" y="167" width="30" height="26" rx="3"/>
    <rect x="402" y="167" width="30" height="26" rx="3"/>
    <rect x="440" y="167" width="30" height="26" rx="3"/>
    <rect x="478" y="167" width="62" height="26" rx="3"/>
  </g>
  <!-- Row 3 (QWERTY) -->
  <g fill="#22d3ee" stroke="#0ea5e9" stroke-width="1" opacity="0.8">
    <rect x="60" y="201" width="46" height="26" rx="3"/>
  </g>
  <g fill="#111827" stroke="#475569" stroke-width="1">
    <rect x="114" y="201" width="30" height="26" rx="3"/>
    <rect x="152" y="201" width="30" height="26" rx="3"/>
    <rect x="190" y="201" width="30" height="26" rx="3"/>
    <rect x="228" y="201" width="30" height="26" rx="3"/>
    <rect x="266" y="201" width="30" height="26" rx="3"/>
    <rect x="304" y="201" width="30" height="26" rx="3"/>
    <rect x="342" y="201" width="30" height="26" rx="3"/>
    <rect x="380" y="201" width="30" height="26" rx="3"/>
    <rect x="418" y="201" width="30" height="26" rx="3"/>
    <rect x="456" y="201" width="30" height="26" rx="3"/>
    <rect x="494" y="201" width="46" height="26" rx="3"/>
  </g>
  <!-- Row 4 -->
  <g fill="#111827" stroke="#475569" stroke-width="1">
    <rect x="60" y="235" width="54" height="26" rx="3"/>
    <rect x="122" y="235" width="30" height="26" rx="3"/>
    <rect x="160" y="235" width="30" height="26" rx="3"/>
    <rect x="198" y="235" width="30" height="26" rx="3"/>
    <rect x="236" y="235" width="30" height="26" rx="3"/>
    <rect x="274" y="235" width="30" height="26" rx="3"/>
    <rect x="312" y="235" width="30" height="26" rx="3"/>
    <rect x="350" y="235" width="30" height="26" rx="3"/>
    <rect x="388" y="235" width="30" height="26" rx="3"/>
    <rect x="426" y="235" width="30" height="26" rx="3"/>
    <rect x="464" y="235" width="76" height="26" rx="3"/>
  </g>
  <!-- Row 5 (Space bar) -->
  <g fill="#111827" stroke="#475569" stroke-width="1">
    <rect x="60" y="269" width="38" height="26" rx="3"/>
    <rect x="106" y="269" width="38" height="26" rx="3"/>
    <rect x="152" y="269" width="38" height="26" rx="3"/>
    <rect x="198" y="269" width="188" height="26" rx="3" fill="#1e293b" stroke="#22d3ee"/>
    <rect x="394" y="269" width="38" height="26" rx="3"/>
    <rect x="440" y="269" width="38" height="26" rx="3"/>
    <rect x="486" y="269" width="38" height="26" rx="3"/>
  </g>
  <!-- RGB underglow -->
  <rect x="40" y="290" width="520" height="8" rx="4" fill="#22d3ee" opacity="0.3"/>
  <!-- Labels -->
  <text x="75" y="217" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="9" font-weight="bold">TAB</text>
  <text x="300" y="285" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">SPACE</text>
</svg>
