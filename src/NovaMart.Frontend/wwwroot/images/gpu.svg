<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- PCB base -->
  <rect x="60" y="100" width="480" height="200" rx="8" fill="#1e3a1e" stroke="#22c55e" stroke-width="1.5"/>
  <!-- GPU chip -->
  <rect x="220" y="150" width="160" height="100" rx="4" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <text x="300" y="208" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold">GPU</text>
  <!-- Fans -->
  <circle cx="120" cy="200" r="45" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="120" cy="200" r="30" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 4"/>
  <circle cx="120" cy="200" r="8" fill="#22d3ee"/>
  <circle cx="480" cy="200" r="45" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="480" cy="200" r="30" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 4"/>
  <circle cx="480" cy="200" r="8" fill="#22d3ee"/>
  <!-- Heat pipes -->
  <rect x="60" y="140" width="480" height="8" rx="4" fill="#334155"/>
  <rect x="60" y="252" width="480" height="8" rx="4" fill="#334155"/>
  <!-- VRAM chips -->
  <rect x="140" y="165" width="30" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="180" y="165" width="30" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="390" y="165" width="30" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="430" y="165" width="30" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="140" y="215" width="30" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="180" y="215" width="30" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="390" y="215" width="30" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="430" y="215" width="30" height="20" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <!-- Connectors -->
  <rect x="60" y="280" width="200" height="20" rx="2" fill="#0ea5e9" opacity="0.6"/>
  <rect x="60" y="280" width="200" height="20" rx="2" fill="none" stroke="#0ea5e9" stroke-width="1"/>
  <!-- Power connector -->
  <rect x="500" y="130" width="40" height="50" rx="3" fill="#fbbf24" opacity="0.8"/>
  <text x="520" y="160" text-anchor="middle" fill="#0f172a" font-size="10" font-weight="bold">PWR</text>
  <!-- Glow effect -->
  <rect x="60" y="100" width="480" height="200" rx="8" fill="url(#glow)" opacity="0.1"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
