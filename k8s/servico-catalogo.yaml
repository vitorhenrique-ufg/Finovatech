apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-catalogo
  namespace: finovatech
  labels:
    app: servico-catalogo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servico-catalogo
  template:
    metadata:
      labels:
        app: servico-catalogo
    spec:
      containers:
        - name: servico-catalogo
          image: finovatech/servico-catalogo:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: servico-catalogo
  namespace: finovatech
spec:
  selector:
    app: servico-catalogo
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
