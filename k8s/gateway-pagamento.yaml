apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-pagamento
  namespace: finovatech
  labels:
    app: gateway-pagamento
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-pagamento
  template:
    metadata:
      labels:
        app: gateway-pagamento
    spec:
      containers:
        - name: gateway-pagamento
          image: finovatech/gateway-pagamento:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: finovatech-config
            - secretRef:
                name: finovatech-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-pagamento
  namespace: finovatech
spec:
  selector:
    app: gateway-pagamento
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
