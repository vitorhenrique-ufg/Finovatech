apiVersion: apps/v1
kind: Deployment
metadata:
  name: novamart-frontend
  namespace: finovatech
  labels:
    app: novamart-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novamart-frontend
  template:
    metadata:
      labels:
        app: novamart-frontend
    spec:
      containers:
        - name: novamart-frontend
          image: finovatech/novamart-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: GatewayApi__BaseUrl
              value: "http://gateway-api:8080"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: novamart-frontend
  namespace: finovatech
spec:
  selector:
    app: novamart-frontend
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer
