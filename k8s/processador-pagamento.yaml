apiVersion: apps/v1
kind: Deployment
metadata:
  name: processador-pagamento
  namespace: finovatech
  labels:
    app: processador-pagamento
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processador-pagamento
  template:
    metadata:
      labels:
        app: processador-pagamento
    spec:
      containers:
        - name: processador-pagamento
          image: finovatech/processador-pagamento:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: finovatech-config
            - secretRef:
                name: finovatech-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: processador-pagamento
  namespace: finovatech
spec:
  selector:
    app: processador-pagamento
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: processador-pagamento-hpa
  namespace: finovatech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: processador-pagamento
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
